# Tests and security checks, on every push and pull request (and before each release).
name: CI

on:
  push:
    branches: [main, macos]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: qrencode, the reference for our QR codes, zsh (its tests are required) and ShellCheck (bash samples)
        run: sudo apt-get install -y -qq --no-install-recommends qrencode zsh shellcheck
      - name: Unit and shell tests
        env:
          BASHOU_REQUIRE_SHELLCHECK: "1"     # tests/test_bash_style.py fails instead of skipping
        run: |
          python -m unittest -v 2> tests.log && exit 0
          cat tests.log
          # Failures as an annotation too: visible on the run's summary page.
          python -c "import sys; t = open('tests.log').read(); t = t[t.find('====='):][:6000] or t[-6000:]; print('::error title=Tests failed::' + t.replace('%', '%25').replace('\r', '').replace('\n', '%0A'))"
          exit 1

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0          # gitleaks scans the whole history
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - name: Only the standard library (no third-party packages to trust)
        run: python -m unittest tests.test_security -v
      - name: Bandit (Python security linter)
        run: |
          python -m pip install --quiet --require-hashes -r .github/requirements/bandit.txt
          bandit -r bashou -ll
      - name: ShellCheck (bash loader)
        run: shellcheck -s bash bashou.bash bashou/room.bash bashou/handover.bash && shellcheck -s sh tools/install-macos.sh
      - name: Gitleaks (secrets in the history)
        run: |
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz" | sha256sum -c
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          ./gitleaks git . --no-banner --redact

  # Rocky Linux 9 (Red Hat family, Python 3.9): rpm and dnf fights against a real rpm database, the
  # coreutils and gcc of that family, and the .rpm package installed with dnf. As a normal user, with an
  # init (--init) so finished processes are reaped like on a real system.
  rocky:
    runs-on: ubuntu-latest
    container:
      image: rockylinux:9
      options: --init
    steps:
      # dnf took 2-3 minutes here (15 s on a laptop): the downloads come from whatever mirror the list
      # gives. Keep the packages between runs, and let dnf pick the closest mirror.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: /var/cache/dnf
          key: rocky9-dnf-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: rocky9-dnf-
      - name: Tools
        run: >
          dnf install -y -q --setopt=keepcache=True --setopt=fastestmirror=True --setopt=max_parallel_downloads=10
          --setopt=install_weak_deps=False --nodocs
          python3 git procps-ng findutils diffutils which gcc gnupg2 rpm-build iproute tcpdump zsh
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Unit and shell tests
        run: |
          useradd -m tester
          cp -r . /home/tester/bashou && chown -R tester:tester /home/tester/bashou
          su - tester -c "cd ~/bashou && python3 -m unittest -q"
      - name: The .rpm installs and runs
        run: |
          su - tester -c "cd ~/bashou && python3 tools/package.py build v0.0.0 dist"   # git refuses root in the runner's checkout
          dnf install -y -q /home/tester/bashou/dist/*.rpm
          su - tester -c "bashou on && bashou version"
          su - tester -c "cd ~/bashou && BASHOU_INSTALLED=1 python3 -m unittest -v tests.test_installed"
          dnf remove -y -q bashou
          test ! -e /etc/profile.d/bashou.sh

  # Debian 12: the .deb installed with apt, every command run from it, and a login shell whose ~/.bashrc
  # loads an old git copy moved to the package (Debian reads profile.d in login shells only).
  debian:
    runs-on: ubuntu-latest
    container:
      image: debian:12
      options: --init
    steps:
      - name: Tools
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends python3 git procps ca-certificates zsh
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: The .deb installs and runs
        run: |
          useradd -m -s /bin/bash tester
          cp -r . /home/tester/bashou && chown -R tester:tester /home/tester/bashou
          su - tester -c "cd ~/bashou && python3 tools/package.py build v0.0.0 dist"
          apt-get install -y -qq /home/tester/bashou/dist/*.deb
          su - tester -c "bashou on && bashou version"
          su - tester -c "cd ~/bashou && BASHOU_INSTALLED=1 python3 -m unittest -v tests.test_installed"
          apt-get remove -y -qq bashou
          test ! -e /etc/profile.d/bashou.sh

  # macOS (2026-10-13): the Mac's own python3 (Xcode's, 3.9) and zsh, as testers have them. Fights and pets
  # run without /proc there. Bash tests use Homebrew's bash (macOS's own is 3.2, too old for Bashou).
  macos:
    runs-on: macos-latest
    # A hung test shows in minutes, not after GitHub's 6 hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: A recent bash, qrencode (the reference for our QR codes), GNU sed (the fights' reference solutions) and ShellCheck
        run: brew install --quiet bash qrencode gnu-sed shellcheck
      - name: Unit and shell tests
        env:
          BASHOU_REQUIRE_SHELLCHECK: "1"
        run: |
          /usr/bin/python3 --version
          bash --version | head -1
          # Each test's name shows as it starts; a test stuck for 3 minutes prints where it waits.
          # The terminal tests run last, so a hang there doesn't hide the other failures.
          set -o pipefail
          others=()
          for f in tests/test_*.py; do [[ $f == tests/test_shell.py ]] || { f=${f%.py}; others+=("${f//\//.}"); }; done
          { /usr/bin/python3 -m tests.watchdog "${others[@]}" && /usr/bin/python3 -m tests.watchdog tests.test_shell; } 2>&1 | tee tests.log && exit 0
          /usr/bin/python3 -c "import sys; t = open('tests.log').read(); t = t[t.find('====='):][:6000] or t[-6000:]; print('::error title=Tests failed on macOS::' + t.replace('%', '%25').replace('\r', '').replace('\n', '%0A'))"
          exit 1
      - name: The Homebrew formula installs and runs
        run: |
          # The formula the tap gets at a release, pointing at a tarball built here, in a local tap.
          /usr/bin/python3 tools/package.py build v0.0.0 dist
          brew tap-new --no-git bashou/local
          tap=$(brew --repository bashou/local)
          /usr/bin/python3 tools/package.py formula v0.0.0 dist/bashou-0.0.0.tar.gz "file://$PWD/dist/bashou-0.0.0.tar.gz" > "$tap/Formula/bashou.rb"
          HOMEBREW_NO_INSTALL_FROM_API=1 brew install --quiet bashou/local/bashou
          brew test bashou/local/bashou
          bashou version | grep -q v0.0.0
          export BASHOU_SHELL=zsh HOME="$RUNNER_TEMP/home" && mkdir -p "$HOME"
          bashou on
          grep -qxF "source $(brew --prefix)/opt/bashou/libexec/bashou.zsh" "$HOME/.zshrc"
          brew uninstall --quiet bashou

  # A commit on main with a line "release: v1.2.3" becomes that release once every check passed.
  release:
    needs: [tests, security, rocky, debian]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Tag and publish a release commit
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          version=$(printf '%s\n' "$MESSAGE" | grep -oE '^release: v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 | cut -d' ' -f2)
          if [ -z "$version" ]; then echo "Not a release commit."; exit 0; fi
          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then echo "$version already exists."; exit 0; fi
          # No changelog section, no tag: the notes come from CHANGELOG.md.
          python3 tools/changelog.py "$version" > notes.md || { echo "::error title=No changelog::Add '## $version' to CHANGELOG.md"; exit 1; }
          git tag "$version"
          git push origin "$version"
          # A draft: releases are immutable once published, so the packages job attaches its files, then publishes.
          gh release create "$version" --draft --title "Bashou $version" --notes-file notes.md
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # The new release in the apt and dnf repositories.
  packages:
    needs: release
    if: needs.release.outputs.version != ''
    uses: ./.github/workflows/packages.yml
    with:
      version: ${{ needs.release.outputs.version }}
    secrets: inherit
    permissions:
      contents: write
      id-token: write
      attestations: write
