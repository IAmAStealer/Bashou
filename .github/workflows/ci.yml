# Tests and security checks, on every push and pull request (and before each release).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: qrencode, the reference for our QR codes
        run: sudo apt-get install -y -qq --no-install-recommends qrencode
      - name: Unit and shell tests
        run: |
          python -m unittest -v 2> tests.log && exit 0
          cat tests.log
          # Failures as an annotation too: visible on the run's summary page.
          python -c "import sys; t = open('tests.log').read(); t = t[t.find('====='):][:6000] or t[-6000:]; print('::error title=Tests failed::' + t.replace('%', '%25').replace('\r', '').replace('\n', '%0A'))"
          exit 1

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0          # gitleaks scans the whole history
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - name: Only the standard library (no third-party packages to trust)
        run: python -m unittest tests.test_security -v
      - name: Bandit (Python security linter)
        run: |
          python -m pip install --quiet bandit==1.9.4
          bandit -r bashou -ll
      - name: ShellCheck (bash loader)
        run: shellcheck -s bash bashou.bash
      - name: Gitleaks (secrets in the history)
        run: |
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz" | sha256sum -c
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          ./gitleaks git . --no-banner --redact

  # Rocky Linux 9 (Red Hat family, Python 3.9): rpm and dnf fights against a real rpm database, the
  # coreutils and gcc of that family, and the .rpm package installed with dnf. As a normal user, with an
  # init (--init) so finished processes are reaped like on a real system.
  rocky:
    runs-on: ubuntu-latest
    container:
      image: rockylinux:9
      options: --init
    steps:
      # dnf took 2-3 minutes here (15 s on a laptop): the downloads come from whatever mirror the list
      # gives. Keep the packages between runs, and let dnf pick the closest mirror.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: /var/cache/dnf
          key: rocky9-dnf-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: rocky9-dnf-
      - name: Tools
        run: >
          dnf install -y -q --setopt=keepcache=True --setopt=fastestmirror=True --setopt=max_parallel_downloads=10
          --setopt=install_weak_deps=False --nodocs
          python3 git procps-ng findutils diffutils which gcc gnupg2 rpm-build iproute tcpdump
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Unit and shell tests
        run: |
          useradd -m tester
          cp -r . /home/tester/bashou && chown -R tester:tester /home/tester/bashou
          su - tester -c "cd ~/bashou && python3 -m unittest -q"
      - name: The .rpm installs and runs
        run: |
          su - tester -c "cd ~/bashou && python3 tools/package.py build v0.0.0 dist"   # git refuses root in the runner's checkout
          dnf install -y -q /home/tester/bashou/dist/*.rpm
          su - tester -c "bashou setup && bashou version"
          dnf remove -y -q bashou

  # A commit on main with a line "release: v1.2.3" becomes that release once every check passed.
  release:
    needs: [tests, security, rocky]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Tag and publish a release commit
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          version=$(printf '%s\n' "$MESSAGE" | grep -oE '^release: v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 | cut -d' ' -f2)
          if [ -z "$version" ]; then echo "Not a release commit."; exit 0; fi
          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then echo "$version already exists."; exit 0; fi
          # No changelog section, no tag: the notes come from CHANGELOG.md.
          python3 tools/changelog.py "$version" > notes.md || { echo "::error title=No changelog::Add '## $version' to CHANGELOG.md"; exit 1; }
          git tag "$version"
          git push origin "$version"
          gh release create "$version" --title "Bashou $version" --notes-file notes.md
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # The new release in the apt and dnf repositories.
  packages:
    needs: release
    if: needs.release.outputs.version != ''
    uses: ./.github/workflows/packages.yml
    with:
      version: ${{ needs.release.outputs.version }}
    secrets: inherit
    permissions:
      contents: write
      id-token: write
      attestations: write
