# The apt and dnf repositories on GitHub Pages: built from a release tag, signed, pushed to gh-pages.
# Runs after each release (ci.yml, release.yml), or by hand: Actions > Packages > Run workflow.
# Needs the repository secret BASHOU_SIGNING_KEY (see doc/contributing/packaging.md), and TAP_TOKEN for the
# Homebrew tap (without it, the tap job only says so).
name: Packages

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Released version to publish (e.g. v0.4.2)"
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # push the gh-pages branch, attach the packages to the release
      id-token: write          # build provenance of the packages
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.version }}
          persist-credentials: false
      - name: Packaging tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm createrepo-c apt-utils file
      - name: Build, sign and publish
        env:
          VERSION: ${{ inputs.version }}
          SIGNING_KEY: ${{ secrets.BASHOU_SIGNING_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ $VERSION =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Version must look like v1.2.3"; exit 1; }
          [ -n "$SIGNING_KEY" ] || { echo "::error title=No signing key::Add the BASHOU_SIGNING_KEY secret"; exit 1; }
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          install -dm700 "$GNUPGHOME"
          printf '%s\n' "$SIGNING_KEY" | gpg --batch --quiet --import
          key=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')
          python3 tools/package.py build "$VERSION" dist
          python3 tools/package.py repo dist site "$key"
          cd site
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" \
            commit -qm "Bashou $VERSION packages"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.extraheader="AUTHORIZATION: basic $auth" \
            push --force --quiet "https://github.com/$GITHUB_REPOSITORY.git" gh-pages
      - name: Provenance of the packages
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: dist/*
      - name: Attach the packages to the release, with signed checksums, and publish it
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          GNUPGHOME: ${{ runner.temp }}/gnupg
        run: |
          # Published releases are immutable (repository setting): files go in while it's still a draft.
          draft=$(gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
          if [ "$draft" != "true" ]; then
            echo "::notice title=Already published::$VERSION is published (immutable): its files stay as they are."
            exit 0
          fi
          cd dist
          sha256sum -- *.deb *.rpm *.tar.gz > SHA256SUMS
          gpg --batch --yes --armor --detach-sign SHA256SUMS
          gh release upload "$VERSION" --clobber --repo "$GITHUB_REPOSITORY" -- *.deb *.rpm *.tar.gz SHA256SUMS SHA256SUMS.asc
          gh release edit "$VERSION" --draft=false --latest --repo "$GITHUB_REPOSITORY"

  # The Homebrew tap (IAmAStealer/homebrew-bashou): Formula/bashou.rb points at this release's tarball.
  # TAP_TOKEN: a fine-grained token with Contents read and write on the tap repository only.
  tap:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.version }}
          persist-credentials: false
      - name: Write the formula and push it to the tap
        env:
          VERSION: ${{ inputs.version }}
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -n "$TAP_TOKEN" ] || { echo "::warning title=No tap token::Add the TAP_TOKEN secret, then run Packages again"; exit 0; }
          # The attached tarball, not a fresh build: the formula's sha256 must match what users download.
          gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" --pattern "bashou-${VERSION#v}.tar.gz" --dir dist
          auth=$(printf 'x-access-token:%s' "$TAP_TOKEN" | base64 -w0)
          git -c http.extraheader="AUTHORIZATION: basic $auth" clone --quiet https://github.com/IAmAStealer/homebrew-bashou.git tap
          mkdir -p tap/Formula
          python3 tools/package.py formula "$VERSION" "dist/bashou-${VERSION#v}.tar.gz" > tap/Formula/bashou.rb
          cd tap
          git add Formula/bashou.rb
          if git diff --cached --quiet; then echo "The tap already has $VERSION."; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" \
            commit -qm "bashou $VERSION"
          git -c http.extraheader="AUTHORIZATION: basic $auth" push --quiet origin HEAD
